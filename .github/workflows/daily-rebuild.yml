name: Daily rebuild

# Rebuilds the site once a day so the GitHub activity heatmap on /projects/
# stays current between pushes. Calls a Cloudflare Workers Builds deploy hook
# stored in the CF_DEPLOY_HOOK_URL repository secret; does nothing without it.

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK_URL is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "Cloudflare responded %{http_code}\n"
